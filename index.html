<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>ZGESTOR — Sistema de Gestão Contábil, Fiscal, DP, Parcelamentos, CNDs e Central do Cliente</title>
  
  <!-- Configurações PWA e Mobile Nativo -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#012147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZGESTOR" />
  <link rel="apple-touch-icon" href="./assets/icone-zioto.png" />
  <link rel="icon" type="image/png" href="./assets/icone-zioto.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase Official JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS (Leitura e Geração de Planilhas Excel .xlsx/.xls/.csv) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button, a, select, input, textarea {
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Rolagem horizontal suave e sem travamento para tabelas no celular */
    .table-container-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Mantém largura mínima para que as colunas não fiquem espremidas em telas pequenas */
    .table-responsive {
      min-width: 650px;
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      word-break: normal;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen w-full overflow-x-hidden">

  <!-- TELA DE LOGIN / AUTENTICAÇÃO (Exibida quando não há sessão ativa) -->
  <div id="app-auth-screen" class="hidden min-h-screen w-full flex items-center justify-center bg-slate-950 p-4"></div>

  <!-- APLICAÇÃO AUTENTICADA -->
  <div id="app-authenticated" class="flex flex-col md:flex-row w-full min-h-screen relative">
    
    <!-- Backdrop Overlay para Drawer Mobile (< 768px) -->
    <div
      id="mobile-sidebar-backdrop"
      onclick="window.ZGestorApp.fecharMenuMobile()"
      class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs z-40 hidden md:hidden transition-opacity duration-300">
    </div>

    <!-- Sidebar Lateral Compacta (Gaveta Deslizante no Mobile < 768px e Fixa no Desktop >= 768px) -->
    <aside
      id="main-sidebar"
      class="fixed inset-y-0 left-0 z-50 w-72 max-w-[85vw] bg-slate-900 text-white flex flex-col justify-between shrink-0 min-h-screen transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 md:static md:w-56 lg:w-56 xl:w-60 md:max-w-none md:min-h-screen shadow-2xl md:shadow-none">
      <div>
        <!-- Logo Oficial do Escritório Zioto Contabilidade -->
        <div class="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-950/40">
          <div class="flex items-center gap-2.5 min-w-0" id="sidebar-brand-block">
            <div class="w-10 h-10 rounded-xl bg-[#0f172a] border border-slate-700/60 p-1 flex items-center justify-center shrink-0 shadow-md">
              <img
                id="sidebar-brand-logo"
                src="./assets/logo-contabil.svg"
                alt="Logo do Escritório"
                class="w-full h-full object-contain rounded-lg"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
              />
              <span style="display:none;" class="font-extrabold text-amber-400 text-xs">ZC</span>
            </div>
            <div class="min-w-0 sidebar-brand-text">
              <div id="sidebar-brand-title" class="font-black tracking-tight text-sm text-white truncate leading-tight">ZIOTO</div>
              <div id="sidebar-brand-subtitle" class="text-[9px] text-amber-400 font-bold uppercase tracking-widest leading-tight truncate">CONTABILIDADE</div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <!-- Botão fechar drawer no mobile -->
            <button
              type="button"
              onclick="window.ZGestorApp.fecharMenuMobile()"
              class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer"
              title="Fechar menu lateral">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <!-- Botão discreto para recolher/expandir o menu no desktop -->
            <button
              id="sidebar-toggle-btn"
              onclick="window.ZGestorApp.toggleSidebar()"
              type="button"
              class="hidden md:flex p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer"
              title="Recolher menu lateral">
              <i data-lucide="chevrons-left" id="sidebar-toggle-icon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Menu de Navegação em 4 Blocos -->
        <div class="p-2.5">
          <nav id="sidebar-nav" class="space-y-2.5"></nav>
        </div>
      </div>

      <!-- Rodapé Técnico da Sidebar (Visível SOMENTE para Administrador) -->
      <div id="sidebar-technical-footer" class="p-3.5 border-t border-slate-800 text-xs text-slate-400 space-y-2">
        <div class="flex items-center justify-between sidebar-footer-text">
          <span>Políticas RLS:</span>
          <span class="text-emerald-400 font-semibold">Ativas</span>
        </div>
        <div class="flex items-center justify-between sidebar-footer-text text-[10px] text-slate-400 pt-1 border-t border-slate-800/60">
          <span>Versão do Sistema:</span>
          <span class="font-mono font-bold text-indigo-400 bg-indigo-950/80 px-2 py-0.5 rounded border border-indigo-800/80">v1.4.0</span>
        </div>
        <button
          onclick="window.zgestorDB.resetToSeedData(); window.ZGestorApp.renderAll(); window.ZGestorApp.showToast('Base de demonstração restaurada!', 'info');"
          class="w-full py-1.5 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium transition flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-amber-400 shrink-0"></i>
          <span class="sidebar-footer-text">Restaurar Dados de Exemplo</span>
        </button>
      </div>
    </aside>

    <!-- Área Principal em Tela Cheia (100% da Largura Disponível, Sem Rolagem Lateral Forçada) -->
    <div class="flex-1 flex flex-col min-w-0 w-full max-w-full overflow-x-hidden">
      <!-- Banner de Modo Simulação (Exibido exclusivamente quando testando o Portal do Cliente) -->
      <div id="simulacao-portal-banner"></div>

      <!-- Barra Superior -->
      <header id="top-header" class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2.5 sm:py-3 sticky top-0 z-30 shadow-xs w-full"></header>

      <!-- Conteúdo Dinâmico da Aba Selecionada (Full Width) -->
      <main id="main-view" class="flex-1 p-2.5 sm:p-4 lg:p-5 w-full max-w-none overflow-x-hidden"></main>
    </div>

  </div><!-- /#app-authenticated -->

  <!-- Container de Modais e Notificações -->
  <div id="modal-root"></div>
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Scripts da Aplicação -->
  <script src="./src/data/seedData.js"></script>
  <script src="./src/lib/dbEngine.js"></script>
  <script src="./src/ui/views.js"></script>
  <script src="./src/ui/reports.js"></script>
  <script src="./src/app.js"></script>

  <!-- Registro do Service Worker PWA para Suporte Mobile & Instalação -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
